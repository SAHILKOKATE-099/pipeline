name: Validate and Deploy Quicky Bite

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate JavaScript
        run: node --check app.js

      - name: Verify required site files
        shell: bash
        run: test -f index.html && test -f styles.css && test -f app.js

  package:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish verified site artifact
        uses: actions/upload-artifact@v4
        with:
          name: quicky-bite-site
          path: .
